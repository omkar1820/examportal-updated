version: "3.9"

services:

  # ── MySQL Database (External / Persistent) ──────────────────
  mysql:
    image: mysql:8.0
    container_name: exam-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: examportal
    ports:
      - "3306:3306"          # Access from host: localhost:3306
    volumes:
      - mysql_data:/var/lib/mysql                         # Persistent data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql  # Auto-load schema
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Tomcat Web App ───────────────────────────────────────────
  app:
    build: .
    container_name: exam-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: examportal
      DB_USER: root
      DB_PASS: root123
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:    # Named volume — data persists even after container restart
